<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DILSHAN — Cyberpunk Developer</title>
  <desc id="desc">Animated neon cyberpunk identity banner with scanning beams, glitch accents, a digital grid and DILSHAN typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050713"/>
      <stop offset=".52" stop-color="#10102b"/>
      <stop offset="1" stop-color="#160923"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ccff"/>
      <stop offset=".48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff4a85"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ccff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ccff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#00ccff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#36cfff" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel"><rect x="18" y="18" width="1164" height="324" rx="18"/></clipPath>
  </defs>

  <rect width="1200" height="360" rx="22" fill="#050713"/>
  <g clip-path="url(#panel)">
    <rect x="18" y="18" width="1164" height="324" rx="18" fill="url(#bg)"/>
    <rect x="18" y="18" width="1164" height="324" fill="url(#grid)"/>
    <path d="M-80 300 L390 18 M140 360 L650 18 M760 360 L1120 18 M980 360 L1280 180" stroke="#00ccff" stroke-opacity=".13" stroke-width="2"/>
    <path d="M40 70H1160 M40 290H1160" stroke="url(#neon)" stroke-opacity=".5" stroke-width="1"/>
    <path d="M55 55h90 M55 55v35 M1145 55h-90 M1145 55v35 M55 305h90 M55 305v-35 M1145 305h-90 M1145 305v-35" fill="none" stroke="#00ccff" stroke-width="2" opacity=".8"/>
    <g fill="#00ccff" opacity=".7">
      <circle cx="100" cy="120" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="240" r="2"><animate attributeName="opacity" values="1;.15;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="92" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="265" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="monospace" font-size="12" fill="#78e6ff" opacity=".72">
      <text x="78" y="88">SYS.ID // DLSHN-01</text>
      <text x="930" y="88">SECURE CONNECTION</text>
      <text x="78" y="282">BUILD • BREAK • REBUILD</text>
      <text x="930" y="282">STATUS: ONLINE</text>
    </g>

    <text x="600" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="900" letter-spacing="10" fill="#00ccff" opacity=".45" filter="url(#glow)">DILSHAN</text>
    <text x="600" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="900" letter-spacing="10" fill="#ffffff" stroke="url(#neon)" stroke-width="1.2" paint-order="stroke" filter="url(#softGlow)">DILSHAN</text>
    <text x="600" y="220" text-anchor="middle" font-family="monospace" font-size="19" letter-spacing="7" fill="#b9c8e8">DIGITAL COMMAND CENTER</text>

    <g opacity=".75">
      <rect x="0" y="0" width="1200" height="3" fill="url(#scan)">
        <animate attributeName="y" values="25;335;25" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="18" y="18" width="1164" height="324" fill="none" stroke="url(#neon)" stroke-width="1.5"/>
    </g>
    <g opacity=".18">
      <text x="604" y="182" text-anchor="middle" font-family="monospace" font-size="86" font-weight="900" letter-spacing="10" fill="#ff4a85">
        DILSHAN
        <animate attributeName="x" values="600;604;598;600" dur="4s" repeatCount="indefinite"/>
      </text>
    </g>
    <path d="M0 248H1200" stroke="#ff4a85" stroke-opacity=".16" stroke-width="1"/>
  </g>
</svg>
