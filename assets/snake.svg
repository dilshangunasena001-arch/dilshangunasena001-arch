<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-labelledby="title desc">
  <title id="title">Animated cyber contribution matrix</title>
  <desc id="desc">Decorative animated neon snake moving through a matrix of contribution-style squares. Replace with a GitHub Actions-generated contribution snake for real activity data.</desc>
  <defs>
    <linearGradient id="snakeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ccff"/>
      <stop offset=".55" stop-color="#9d4edd"/>
      <stop offset="1" stop-color="#ff4a85"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="cells" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="14" height="14" rx="3" fill="#18233b"/>
      <rect x="2" y="2" width="14" height="14" rx="3" fill="#00ccff" opacity=".06"/>
    </pattern>
  </defs>
  <rect width="900" height="170" rx="12" fill="#080b16"/>
  <rect x="24" y="20" width="852" height="130" fill="url(#cells)"/>
  <g opacity=".75">
    <rect x="46" y="44" width="14" height="14" rx="3" fill="#124a65"/>
    <rect x="68" y="66" width="14" height="14" rx="3" fill="#176b83"/>
    <rect x="112" y="88" width="14" height="14" rx="3" fill="#4a2878"/>
    <rect x="178" y="44" width="14" height="14" rx="3" fill="#7b2e72"/>
    <rect x="244" y="110" width="14" height="14" rx="3" fill="#14516d"/>
    <rect x="310" y="66" width="14" height="14" rx="3" fill="#245e89"/>
    <rect x="376" y="88" width="14" height="14" rx="3" fill="#5d337d"/>
    <rect x="442" y="44" width="14" height="14" rx="3" fill="#9b356e"/>
    <rect x="508" y="110" width="14" height="14" rx="3" fill="#176b83"/>
    <rect x="574" y="66" width="14" height="14" rx="3" fill="#245e89"/>
    <rect x="640" y="88" width="14" height="14" rx="3" fill="#5d337d"/>
    <rect x="706" y="44" width="14" height="14" rx="3" fill="#9b356e"/>
    <rect x="772" y="110" width="14" height="14" rx="3" fill="#176b83"/>
  </g>
  <path d="M40 76 H150 V54 H260 V98 H370 V76 H480 V120 H590 V54 H700 V98 H840"
        fill="none" stroke="url(#snakeGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="18 10" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-112" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <circle r="8" fill="#ffffff" stroke="#00ccff" stroke-width="4" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M40 76 H150 V54 H260 V98 H370 V76 H480 V120 H590 V54 H700 V98 H840"/>
  </circle>
  <text x="30" y="160" fill="#79dfff" font-family="monospace" font-size="10" letter-spacing="2">CONTRIBUTION MATRIX // DECORATIVE PREVIEW — CONNECT GITHUB ACTIONS FOR LIVE DATA</text>
</svg>
