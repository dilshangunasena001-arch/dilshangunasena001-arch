name: Generate Contribution Snake

on:
  schedule:
    # Run automatically every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Allow manual execution from the Actions tab
  push:
    branches:
      - main

jobs:
  build-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate contribution snake
        id: snake
        uses: platane/snk@v2
        with:
          github_user_name: dilshangunasena001-arch
          # Output an animated GIF and a static SVG
          gif_output: dist/github-snake.gif
          svg_output: dist/github-snake.svg

      - name: Publish snake to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: dilshangunasena001-arch/HashanOx-snake-output
          publish_branch: main
          publish_dir: ./dist
          keep_files: true
          # A personal access token with repo scope is required.
          # Add it as a repository secret named SNAKE_OUTPUT_TOKEN.
          personal_token: ${{ secrets.SNAKE_OUTPUT_TOKEN }}
          commit_message: "chore: regenerate contribution snake"
